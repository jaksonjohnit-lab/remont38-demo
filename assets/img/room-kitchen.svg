<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Интерьер кухни: гарнитур, плитка, техника">
  <defs>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#ebe3d5"/>
    </linearGradient>
    <linearGradient id="floor2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c2a0"/>
      <stop offset="1" stop-color="#c6ab86"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wall2)"/>
  <path d="M0 440 H800 V600 H0 Z" fill="url(#floor2)"/>
  <g stroke="#b3906a" stroke-width="2" opacity="0.45">
    <path d="M0 485 H800"/><path d="M0 530 H800"/><path d="M0 575 H800"/>
  </g>

  <!-- фартук-плитка -->
  <g>
    <rect x="86" y="250" width="520" height="130" fill="#dfe8e4"/>
    <g stroke="#c9d6d0" stroke-width="2">
      <path d="M86 282 H606"/><path d="M86 314 H606"/><path d="M86 346 H606"/>
      <path d="M172 250 V380"/><path d="M258 250 V380"/><path d="M344 250 V380"/><path d="M430 250 V380"/><path d="M516 250 V380"/>
    </g>
  </g>

  <!-- верхние шкафы -->
  <g>
    <rect x="86" y="96" width="240" height="140" rx="8" fill="#7d8f7b"/>
    <rect x="196" y="96" width="6" height="140" fill="#6b7c69"/>
    <rect x="348" y="96" width="240" height="140" rx="8" fill="#7d8f7b"/>
    <rect x="458" y="96" width="6" height="140" fill="#6b7c69"/>
    <rect x="112" y="128" width="70" height="80" rx="5" fill="#93a58f" opacity="0.6"/>
    <rect x="374" y="128" width="70" height="80" rx="5" fill="#93a58f" opacity="0.6"/>
  </g>

  <!-- вытяжка -->
  <g>
    <path d="M470 236 H560 L580 96 H450 Z" fill="#d7d2c8"/>
    <rect x="440" y="228" width="150" height="14" rx="6" fill="#bfb9ad"/>
  </g>

  <!-- нижние шкафы и столешница -->
  <g>
    <rect x="60" y="380" width="560" height="130" rx="10" fill="#6f816d"/>
    <rect x="60" y="368" width="580" height="20" rx="8" fill="#efe4d2"/>
    <rect x="120" y="382" width="150" height="126" fill="#7f9179"/>
    <rect x="278" y="382" width="150" height="126" fill="#7f9179"/>
    <rect x="436" y="382" width="150" height="126" fill="#7f9179"/>
    <rect x="148" y="418" width="90" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="306" y="418" width="90" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="464" y="418" width="90" height="8" rx="4" fill="#d6cfc2"/>
  </g>

  <!-- плита -->
  <g>
    <rect x="300" y="368" width="180" height="10" rx="4" fill="#2f2c28"/>
    <circle cx="340" cy="372" r="14" fill="#4a4640"/>
    <circle cx="400" cy="372" r="14" fill="#4a4640"/>
    <circle cx="460" cy="372" r="14" fill="#4a4640"/>
  </g>

  <!-- мойка -->
  <g>
    <rect x="90" y="372" width="120" height="10" rx="4" fill="#c9c3b8"/>
    <rect x="104" y="360" width="92" height="14" rx="6" fill="#b7b1a6"/>
    <path d="M150 360 V330 Q150 318 164 318 H178" stroke="#9b958a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- холодильник -->
  <g>
    <rect x="650" y="170" width="120" height="320" rx="10" fill="#e8e3d9"/>
    <rect x="650" y="170" width="120" height="120" rx="10" fill="#ded8cc"/>
    <rect x="700" y="200" width="8" height="50" rx="4" fill="#a8a196"/>
    <rect x="700" y="310" width="8" height="80" rx="4" fill="#a8a196"/>
  </g>

  <!-- декор -->
  <g>
    <rect x="170" y="320" width="34" height="44" rx="5" fill="#c9552b"/>
    <rect x="214" y="330" width="28" height="34" rx="5" fill="#e0b15c"/>
    <path d="M540 320 Q540 292 558 284 Q566 312 552 330 Z" fill="#5d8a68"/>
    <rect x="536" y="328" width="30" height="22" rx="4" fill="#b9764f"/>
  </g>

  <!-- табурет -->
  <g>
    <ellipse cx="640" cy="540" rx="60" ry="14" fill="#a98c6a" opacity="0.3"/>
    <rect x="596" y="470" width="88" height="16" rx="7" fill="#c98a5d"/>
    <rect x="606" y="486" width="9" height="52" rx="4" fill="#8a5a3b"/>
    <rect x="664" y="486" width="9" height="52" rx="4" fill="#8a5a3b"/>
  </g>

  <rect x="0" y="434" width="800" height="10" fill="#f7f2e9" opacity="0.85"/>
</svg>
