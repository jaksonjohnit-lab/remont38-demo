<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Интерьер гостиной: диван, окно, лампа и растения">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ebdf"/>
      <stop offset="1" stop-color="#e9dfd0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcc3a0"/>
      <stop offset="1" stop-color="#c9ab84"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7ebf0"/>
      <stop offset="1" stop-color="#b9dbe4"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cb7d5b"/>
      <stop offset="1" stop-color="#b4623f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <path d="M0 430 H800 V600 H0 Z" fill="url(#floor)"/>
  <g stroke="#b9986f" stroke-width="2" opacity="0.5">
    <path d="M0 470 H800"/><path d="M0 515 H800"/><path d="M0 560 H800"/>
  </g>

  <!-- окно -->
  <g>
    <rect x="64" y="96" width="250" height="270" rx="8" fill="#ffffff"/>
    <rect x="74" y="106" width="230" height="250" rx="4" fill="url(#sky)"/>
    <path d="M74 300 Q130 270 180 292 T304 286 V356 H74 Z" fill="#a8c9b0" opacity="0.7"/>
    <path d="M189 106 V356" stroke="#ffffff" stroke-width="10"/>
    <path d="M74 230 H304" stroke="#ffffff" stroke-width="10"/>
    <rect x="56" y="366" width="266" height="12" rx="6" fill="#f7f2e9"/>
  </g>

  <!-- картина -->
  <g>
    <rect x="372" y="110" width="120" height="150" rx="6" fill="#f7f2e9" stroke="#d9cbb8" stroke-width="3"/>
    <path d="M388 236 L420 186 L446 216 L466 178 L476 236 Z" fill="#c9a27a"/>
    <circle cx="420" cy="156" r="14" fill="#e0b15c"/>
  </g>

  <!-- диван -->
  <g>
    <ellipse cx="560" cy="520" rx="220" ry="26" fill="#a98c6a" opacity="0.35"/>
    <rect x="390" y="278" width="330" height="120" rx="22" fill="url(#sofa)"/>
    <rect x="410" y="300" width="135" height="72" rx="14" fill="#d78d6a"/>
    <rect x="558" y="300" width="135" height="72" rx="14" fill="#d78d6a"/>
    <rect x="372" y="378" width="366" height="96" rx="18" fill="#bd6a47"/>
    <rect x="392" y="392" width="150" height="62" rx="12" fill="#d99a72"/>
    <rect x="558" y="392" width="150" height="62" rx="12" fill="#d99a72"/>
    <rect x="372" y="360" width="42" height="96" rx="14" fill="#a95a3a"/>
    <rect x="696" y="360" width="42" height="96" rx="14" fill="#a95a3a"/>
    <rect x="404" y="472" width="14" height="26" rx="5" fill="#6f4630"/>
    <rect x="690" y="472" width="14" height="26" rx="5" fill="#6f4630"/>
    <rect x="452" y="330" width="66" height="54" rx="12" fill="#e8c26a"/>
    <rect x="630" y="332" width="56" height="50" rx="12" fill="#7f9c86"/>
  </g>

  <!-- ковёр и столик -->
  <g>
    <ellipse cx="540" cy="528" rx="250" ry="46" fill="#ead8bd"/>
    <ellipse cx="540" cy="528" rx="210" ry="36" fill="#f2e6d2"/>
    <rect x="470" y="470" width="150" height="16" rx="8" fill="#8a5a3b"/>
    <rect x="484" y="486" width="10" height="26" rx="4" fill="#6f4630"/>
    <rect x="596" y="486" width="10" height="26" rx="4" fill="#6f4630"/>
    <rect x="520" y="446" width="30" height="24" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="560" y="452" width="22" height="18" rx="4" fill="#c9552b" opacity="0.8"/>
  </g>

  <!-- торшер -->
  <g>
    <path d="M716 236 L756 236 L770 300 L702 300 Z" fill="#f0c979"/>
    <rect x="732" y="300" width="8" height="176" rx="4" fill="#8a6b4f"/>
    <ellipse cx="736" cy="486" rx="34" ry="9" fill="#8a6b4f"/>
  </g>

  <!-- растение -->
  <g>
    <path d="M156 430 Q142 386 160 356 Q178 392 168 430 Z" fill="#5d8a68"/>
    <path d="M166 430 Q178 378 206 360 Q204 404 180 432 Z" fill="#6f9d76"/>
    <path d="M160 432 Q126 402 116 372 Q152 390 168 428 Z" fill="#4e7a5c"/>
    <path d="M140 430 H184 L176 486 H148 Z" fill="#b9764f"/>
  </g>

  <!-- плинтус -->
  <rect x="0" y="424" width="800" height="10" fill="#f7f2e9" opacity="0.85"/>
</svg>
